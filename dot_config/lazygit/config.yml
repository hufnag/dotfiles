gui:
  nerdFontsVersion: "3"

customCommands:
  - description: "Add empty commit"
    key: "E"
    context: "commits"
    loadingText: "Committing empty commit..."
    command: 'git commit --allow-empty -m "{{.Form.Message}}"'
    prompts:
      - type: "input"
        key: "Message"
        title: "Empty commit message"
  - description: "Push all branches"
    key: "<c-p>"
    context: "global"
    loadingText: "Pushing all branches..."
    command: "git push {{.Form.PushMode}} --all"
    prompts:
      - type: "menu"
        key: "PushMode"
        title: "Force push?"
        options:
          - name: "No"
            value: ""
          - name: "Yes, with lease"
            description: "Refuse to overwrite unexpected remote changes"
            value: "--force-with-lease"
      - type: "confirm"
        title: "Push all branches"
        body: "Push every local branch to the default remote?"
